<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Geometric Constructions</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1a2e;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        #canvas-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 72px; /* height of toolbar */
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1a1a2e;
        }

        #main-canvas {
            display: block;
            /* Scale canvas to fit available space while keeping 1:1 aspect ratio */
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            touch-action: none;
            cursor: crosshair;
            border-radius: 4px;
            box-shadow: 0 4px 32px rgba(0, 0, 0, 0.5);
        }

        #toolbar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 72px;
            background: #16213e;
            border-top: 1px solid #0f3460;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 0 16px;
            z-index: 10;
        }

        .toolbar-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .toolbar-divider {
            width: 1px;
            height: 36px;
            background: #0f3460;
            margin: 0 4px;
        }

        .tool-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            min-width: 56px;
            height: 52px;
            padding: 6px 12px;
            background: #0f3460;
            color: #a8b2d8;
            border: 1.5px solid #1a3a6e;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.15s, color 0.15s, border-color 0.15s, transform 0.1s;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        .tool-btn .icon {
            font-size: 18px;
            line-height: 1;
        }

        .tool-btn:hover {
            background: #1a4a8e;
            color: #e6f0ff;
            border-color: #3a6aae;
        }

        .tool-btn:active {
            transform: scale(0.94);
        }

        .tool-btn.active {
            background: #e94560;
            color: #fff;
            border-color: #ff6b80;
        }

        .tool-btn.action-btn {
            background: #0f3460;
            color: #a8b2d8;
        }

        .tool-btn.action-btn:hover {
            background: #1a4a8e;
            color: #e6f0ff;
        }

        .tool-btn.check-btn {
            background: #1b5e40;
            color: #a7f3c8;
            border-color: #2e7d52;
            min-width: 68px;
        }

        .tool-btn.check-btn:hover {
            background: #2e7d52;
            color: #d1fae5;
        }

        /* shrink slightly on very small screens */
        @media (max-width: 420px) {
            #toolbar {
                gap: 6px;
                padding: 0 8px;
            }
            .tool-btn {
                min-width: 44px;
                height: 48px;
                padding: 4px 8px;
                font-size: 10px;
            }
            .tool-btn .icon {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>
    <div id="canvas-wrapper">
        <canvas id="main-canvas" width="1000" height="1000"></canvas>
    </div>

    <div id="toolbar">
        <div class="toolbar-group">
            <button class="tool-btn active" id="line" type="button" onclick="switchMode('line')">
                <span class="icon">📏</span>Line
            </button>
            <button class="tool-btn" id="circle" type="button" onclick="switchMode('circle')">
                <span class="icon">⭕</span>Circle
            </button>
            <button class="tool-btn" id="move" type="button" onclick="switchMode('move')">
                <span class="icon">✋</span>Move
            </button>
        </div>

        <div class="toolbar-divider"></div>

        <div class="toolbar-group">
            <button class="tool-btn action-btn" id="undo" type="button" onclick="undo()">
                <span class="icon">↩️</span>Undo
            </button>
            <button class="tool-btn action-btn" id="redo" type="button" onclick="redo()">
                <span class="icon">↪️</span>Redo
            </button>
        </div>

        <div class="toolbar-divider"></div>

        <div class="toolbar-group">
            <button class="tool-btn check-btn" id="is-solved" type="button" onclick="isSolved()">
                <span class="icon">✅</span>Check
            </button>
        </div>
    </div>

    <script src="Scripts/Game/Levels/gcLevel1.js"></script>
    <script src="Scripts/Game/drawingRules.js"></script>
    <script src="Scripts/Game/MathHelpers.js"></script>
    <script src="Scripts/Game/GeometricConstructionsCanvas.js"></script>
    <script src="Scripts/Game/GoemetricConstructionsBoard.js"></script>
    <script src="Scripts/Game/GeometricConstructionsGame.js"></script>
    <script src="Scripts/main.js"></script>
</body>

</html>
