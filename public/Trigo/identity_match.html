<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trig Identities Matcher</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <!-- Added KaTeX for rendering math equations -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    
    <style>
        /* Custom styles for animations and smooth transitions */
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #f8fafc;
        }
        .trig-box {
            transition: all 0.2s ease-in-out;
            user-select: none;
            -webkit-user-select: none;
        }
        .trig-box:active {
            transform: scale(0.98);
        }
        .selected {
            ring-width: 4px;
            ring-color: #6366f1;
            border-color: #6366f1;
            background-color: #e0e7ff;
        }
        .shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }
        /* SVG Line drawing animation */
        .line-path {
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: drawLine 0.4s ease-out forwards;
        }
        @keyframes drawLine {
            to { stroke-dashoffset: 0; }
        }
    </style>
</head>
<body class="min-h-screen text-slate-800 p-4 md:p-8 flex flex-col items-center" dir="rtl">

    <!-- Language Selector -->
    <div class="absolute top-4 left-4 md:top-6 md:left-6 z-50">
        <select id="lang-select" onchange="changeLanguage(this.value)" class="bg-white border border-slate-300 text-slate-700 text-sm rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block w-full p-2 cursor-pointer shadow-sm">
            <option value="he" selected>עברית</option>
            <option value="en">English</option>
        </select>
    </div>

    <div id="header" class="text-center mb-6 max-w-2xl w-full mt-8 md:mt-0">
        <h1 id="title-text" class="text-3xl md:text-4xl font-bold text-indigo-900 mb-2">זהויות טריגונומטריות</h1>
        <p id="subtitle-text" class="text-slate-600 mb-4">חברו את הצד השמאלי של הזהות לצד הימני המתאים לה.</p>
        
        <div id="message-box" class="hidden rounded-md p-3 mb-4 text-sm font-medium transition-all duration-300"></div>
    </div>

    <!-- Forced LTR for equations so LHS is always on the physical left -->
    <div id="game-view" class="w-full max-w-4xl relative" dir="ltr">
        
        <!-- SVG Canvas for drawing the connecting lines -->
        <svg id="connections-canvas" class="absolute top-0 left-0 w-full h-full pointer-events-none z-10"></svg>
        
        <!-- Columns container -->
        <div class="flex justify-between w-full relative z-20 gap-12 md:gap-32 px-2 md:px-10">
            <!-- Left Side (LHS) -->
            <div id="lhs-column" class="w-5/12 md:w-1/3 flex flex-col gap-4"></div>
            
            <!-- Right Side (RHS) -->
            <div id="rhs-column" class="w-5/12 md:w-1/3 flex flex-col gap-4"></div>
        </div>

        <div class="mt-8 flex justify-center pb-12 z-30 relative" dir="rtl">
            <button id="check-btn" onclick="checkAnswers()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-8 rounded-full shadow-lg transition-transform transform hover:-translate-y-1 active:translate-y-0 text-lg">
                בדוק תשובות
            </button>
        </div>
    </div>

    <div id="success-view" class="hidden w-full max-w-2xl bg-white p-6 md:p-10 rounded-2xl shadow-xl flex-col items-center border border-indigo-100">
        <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mb-4">
            <svg class="w-10 h-10 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
        </div>
        <h2 id="success-title" class="text-3xl font-bold text-slate-800 mb-2">עבודה מצוינת!</h2>
        <p id="success-subtitle" class="text-slate-600 mb-6 text-center">התאמתם בהצלחה את כל הזהויות הטריגונומטריות.</p>
        
        <div id="summary-list" class="w-full bg-slate-50 p-4 rounded-xl space-y-3 mb-8 border border-slate-200" dir="ltr">
            <!-- Summary items injected via JS -->
        </div>

        <a href="trig_solver_game.html" id="next-level-btn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-10 rounded-full shadow-lg transition-colors text-lg inline-block flex items-center gap-2">
            <span>לשלב הבא</span> <span>🡨</span>
        </a>
    </div>

    <script>
        // The core data for the game
        const identitiesData = [
            { id: 1, lhs: "\\sin^2(\\alpha) + \\cos^2(\\alpha)", rhs: "1" },
            { id: 2, lhs: "\\sin(2\\alpha)", rhs: "2\\sin(\\alpha)\\cos(\\alpha)" },
            { id: 3, lhs: "\\cos(2\\alpha)", rhs: "\\cos^2(\\alpha) - \\sin^2(\\alpha)" },
            { id: 4, lhs: "\\tan(\\alpha)", rhs: "\\frac{\\sin(\\alpha)}{\\cos(\\alpha)}" },
            { id: 5, lhs: "\\sin(-\\alpha)", rhs: "-\\sin(\\alpha)" },
            { id: 6, lhs: "\\cos(-\\alpha)", rhs: "\\cos(\\alpha)" },
            { id: 7, lhs: "\\sin(180^\\circ - \\alpha)", rhs: "\\sin(\\alpha)" },
            { id: 8, lhs: "\\cos(180^\\circ - \\alpha)", rhs: "-\\cos(\\alpha)" },
            { id: 9, lhs: "\\sin(\\alpha + \\beta)", rhs: "\\sin(\\alpha)\\cos(\\beta) + \\cos(\\alpha)\\sin(\\beta)" },
            { id: 10, lhs: "\\cos(\\alpha + \\beta)", rhs: "\\cos(\\alpha)\\cos(\\beta) - \\sin(\\alpha)\\sin(\\beta)" },
            { id: 11, lhs: "\\sin(90^\\circ - \\alpha)", rhs: "\\cos(\\alpha)" }
        ];

        // State management
        let selectedLHS = null;
        let connections = {}; // maps lhs_id -> rhs_id
        let validations = {}; // maps lhs_id -> 'correct' | 'incorrect'
        let rightSideShuffled = [];
        
        let currentLang = 'he';

        const translations = {
            en: {
                title: "Trigonometric Identities",
                subtitle: "Connect the left side of the identity to its correct right side.",
                checkBtn: "Check Answers",
                successTitle: "Excellent Work!",
                successSubtitle: "You successfully matched all the trigonometric identities.",
                nextLevelText: "Next Level",
                nextLevelArrow: "➔",
                msgSelectLeftFirst: "Tap a box on the left first!",
                msgConnectAllLeft: (n) => `Please connect all identities. You have ${n} left.`,
                msgIncorrect: "Some connections are incorrect (marked in red). Tap a red connection's left box to try again!",
                dir: "ltr"
            },
            he: {
                title: "זהויות טריגונומטריות",
                subtitle: "חברו את הצד השמאלי של הזהות לצד הימני המתאים לה.",
                checkBtn: "בדוק תשובות",
                successTitle: "עבודה מצוינת!",
                successSubtitle: "התאמתם בהצלחה את כל הזהויות הטריגונומטריות.",
                nextLevelText: "לשלב הבא",
                nextLevelArrow: "🡨",
                msgSelectLeftFirst: "לחצו קודם על תיבה בצד שמאל!",
                msgConnectAllLeft: (n) => `אנא חברו את כל הזהויות. נותרו לכם ${n}.`,
                msgIncorrect: "חלק מהחיבורים שגויים (מסומנים באדום). לחצו על תיבה שמאלית של חיבור אדום כדי לנסות שוב!",
                dir: "rtl"
            }
        };

        function changeLanguage(lang) {
            currentLang = lang;
            const t = translations[lang];
            
            document.body.dir = t.dir;
            document.getElementById('title-text').textContent = t.title;
            document.getElementById('subtitle-text').textContent = t.subtitle;
            document.getElementById('check-btn').textContent = t.checkBtn;
            document.getElementById('success-title').textContent = t.successTitle;
            document.getElementById('success-subtitle').textContent = t.successSubtitle;
            
            const nextBtn = document.getElementById('next-level-btn');
            nextBtn.innerHTML = `<span>${t.nextLevelText}</span> <span>${t.nextLevelArrow}</span>`;
            
            // Re-check answers to update potential message language
            const msgBox = document.getElementById('message-box');
            if (!msgBox.classList.contains('hidden')) {
                msgBox.classList.add('hidden'); // Clear current message when switching languages
            }
            
            // Redraw lines to ensure correct alignment if layout shifted slightly
            setTimeout(drawLines, 10);
        }

        function initGame() {
            // Prepare shuffled right-hand side
            rightSideShuffled = [...identitiesData].sort(() => Math.random() - 0.5);
            
            const lhsCol = document.getElementById('lhs-column');
            const rhsCol = document.getElementById('rhs-column');
            
            lhsCol.innerHTML = '';
            rhsCol.innerHTML = '';

            // Render LHS boxes
            identitiesData.forEach((item) => {
                const box = createBox(item.lhs, `lhs-${item.id}`, 'lhs');
                lhsCol.appendChild(box);
            });

            // Render RHS boxes
            rightSideShuffled.forEach((item) => {
                const box = createBox(item.rhs, `rhs-${item.id}`, 'rhs');
                rhsCol.appendChild(box);
            });

            // Handle window resizing to keep lines attached properly
            window.addEventListener('resize', drawLines);
        }

        function createBox(text, id, side) {
            const div = document.createElement('div');
            div.id = id;
            div.className = `trig-box w-full bg-white border-2 border-slate-200 rounded-xl p-2 md:p-3 text-xs md:text-sm font-medium text-slate-700 shadow-sm cursor-pointer hover:border-indigo-400 hover:shadow-md flex items-center justify-center text-center min-h-[44px] overflow-x-auto`;
            
            // Render the math text as an equation using KaTeX
            try {
                katex.render("\\displaystyle " + text, div, {
                    throwOnError: false
                });
            } catch (e) {
                div.innerHTML = text; // Fallback
            }
            
            div.onclick = () => handleBoxClick(id, side);
            return div;
        }

        function handleBoxClick(id, side) {
            const msgBox = document.getElementById('message-box');
            msgBox.classList.add('hidden'); // clear previous messages
            
            const t = translations[currentLang];

            if (side === 'lhs') {
                // If a LHS is already selected, deselect it
                if (selectedLHS) {
                    document.getElementById(selectedLHS).classList.remove('ring-2', 'ring-indigo-500', 'border-indigo-500', 'bg-indigo-50');
                }
                
                selectedLHS = id;
                const el = document.getElementById(id);
                el.classList.add('ring-2', 'ring-indigo-500', 'border-indigo-500', 'bg-indigo-50');
                
                // Clear any error state visually if we are trying to fix it
                if (validations[id]) {
                    delete validations[id];
                    drawLines();
                }

            } else if (side === 'rhs') {
                if (!selectedLHS) {
                    showMessage(t.msgSelectLeftFirst, "bg-amber-100 text-amber-800");
                    return;
                }

                const lhsIdStr = selectedLHS;
                
                // Remove if this RHS is already connected to another LHS
                for (let key in connections) {
                    if (connections[key] === id) {
                        delete connections[key];
                        delete validations[key];
                    }
                }

                // Make the new connection
                connections[lhsIdStr] = id;
                delete validations[lhsIdStr]; // reset validation for this connection
                
                // Reset visual selection state
                document.getElementById(selectedLHS).classList.remove('ring-2', 'ring-indigo-500', 'border-indigo-500', 'bg-indigo-50');
                selectedLHS = null;
                
                drawLines();
            }
        }

        function drawLines() {
            const svg = document.getElementById('connections-canvas');
            svg.innerHTML = ''; // clear current lines
            
            const gameView = document.getElementById('game-view');
            const containerRect = gameView.getBoundingClientRect();

            for (const [lhsId, rhsId] of Object.entries(connections)) {
                const lhsEl = document.getElementById(lhsId);
                const rhsEl = document.getElementById(rhsId);
                
                if (!lhsEl || !rhsEl) continue;

                // Calculate connection points relative to the container
                const x1 = lhsEl.offsetLeft + lhsEl.offsetWidth;
                const y1 = lhsEl.offsetTop + (lhsEl.offsetHeight / 2);
                
                const x2 = rhsEl.offsetLeft;
                const y2 = rhsEl.offsetTop + (rhsEl.offsetHeight / 2);

                const isIncorrect = validations[lhsId] === 'incorrect';
                const isCorrect = validations[lhsId] === 'correct';

                let strokeColor = '#94a3b8'; // default slate-400
                if (isIncorrect) strokeColor = '#ef4444'; // red-500
                else if (isCorrect) strokeColor = '#22c55e'; // green-500
                else if (lhsId === selectedLHS) strokeColor = '#6366f1'; // indigo-500

                // Create SVG path (using a bezier curve for a nice visual look)
                const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                const curveForce = Math.abs(x2 - x1) * 0.5;
                const d = `M ${x1} ${y1} C ${x1 + curveForce} ${y1}, ${x2 - curveForce} ${y2}, ${x2} ${y2}`;
                
                path.setAttribute('d', d);
                path.setAttribute('stroke', strokeColor);
                path.setAttribute('stroke-width', isIncorrect || isCorrect ? '4' : '3');
                path.setAttribute('fill', 'none');
                path.setAttribute('stroke-linecap', 'round');
                
                // Only add drawing animation if it's not a validated state
                if (!isIncorrect && !isCorrect) {
                    path.classList.add('line-path');
                }

                svg.appendChild(path);
            }
        }

        function checkAnswers() {
            const numTotal = identitiesData.length;
            const numConnected = Object.keys(connections).length;
            const t = translations[currentLang];

            if (numConnected < numTotal) {
                showMessage(t.msgConnectAllLeft(numTotal - numConnected), "bg-amber-100 text-amber-800");
                return;
            }

            let allCorrect = true;

            // Validate all current connections
            for (const [lhsIdStr, rhsIdStr] of Object.entries(connections)) {
                const numericLhsId = parseInt(lhsIdStr.replace('lhs-', ''));
                const numericRhsId = parseInt(rhsIdStr.replace('rhs-', ''));

                if (numericLhsId === numericRhsId) {
                    validations[lhsIdStr] = 'correct';
                } else {
                    validations[lhsIdStr] = 'incorrect';
                    allCorrect = false;
                    
                    // Add shake animation to incorrect boxes
                    const lhsEl = document.getElementById(lhsIdStr);
                    const rhsEl = document.getElementById(rhsIdStr);
                    lhsEl.classList.remove('shake');
                    rhsEl.classList.remove('shake');
                    void lhsEl.offsetWidth; // trigger reflow
                    lhsEl.classList.add('shake');
                    rhsEl.classList.add('shake');
                }
            }

            drawLines(); // redraw to show red/green colors

            if (allCorrect) {
                handleWin();
            } else {
                showMessage(t.msgIncorrect, "bg-red-100 text-red-800");
            }
        }

        function showMessage(text, classes) {
            const msgBox = document.getElementById('message-box');
            msgBox.textContent = text;
            msgBox.className = `rounded-md p-3 mb-4 text-sm md:text-base font-medium transition-all duration-300 ${classes}`;
            msgBox.classList.remove('hidden');
        }

        function handleWin() {
            // Trigger confetti
            confetti({
                particleCount: 150,
                spread: 70,
                origin: { y: 0.6 },
                colors: ['#6366f1', '#22c55e', '#eab308', '#ec4899']
            });

            // Hide game, show summary
            document.getElementById('header').classList.add('hidden');
            document.getElementById('game-view').classList.add('hidden');
            
            const successView = document.getElementById('success-view');
            const summaryList = document.getElementById('summary-list');
            summaryList.innerHTML = ''; // clear

            // Populate summary securely and centrally aligned
            identitiesData.forEach(item => {
                const div = document.createElement('div');
                div.className = 'py-4 border-b border-slate-200 last:border-0 flex justify-center items-center text-center overflow-x-auto text-lg';
                
                try {
                    katex.render(`\\displaystyle ${item.lhs} = ${item.rhs}`, div, {
                        throwOnError: false
                    });
                } catch(e) {
                    div.textContent = `${item.lhs} = ${item.rhs}`;
                }
                
                summaryList.appendChild(div);
            });

            successView.classList.remove('hidden');
            successView.classList.add('flex');
        }

        // Initialize everything when the window loads
        window.onload = () => {
            initGame();
        };
    </script>
</body>
</html>
