          { type: "step", label: "נתח גורמים", equation: "\\tan^2(x) + 1 = 0 \\implies \\text{אין פתרון ממשי}", explanation: "מספר ממשי בריבוע אינו יכול להיות שלילי." },
          { type: "step", label: "מקרים נותרים", equation: "\\tan(x) = 0 \\quad \\text{או} \\quad \\tan^2(x) = 1", explanation: "השוואת הגורמים הנותרים לאפס." },
          { type: "question", qType: "type", text: "מצא את הזווית החיובית הקטנה ביותר עבור $\\tan(x) = 1$:", answer: "45" },
          { type: "step", label: "מצא פתרונות ראשיים", equation: "x = 0^\\circ \\quad \\text{או} \\quad x = \\pm 45^\\circ", explanation: "פתרון $\\tan(x)=0$ ו- $\\tan(x)=\\pm 1$." }
        ]
      }
    ];

    // --- STREAMING_CHUNK:KaTeX Math Parser Component ---
    const MathText = ({ text, block = false }) => {
      if (!text) return null;
      if (!text.includes('$')) {
        if (block) {
          try {
            const html = window.katex.renderToString(text, { displayMode: true, throwOnError: false });
            return <span className="math-ltr" dangerouslySetInnerHTML={{ __html: html }} />;
          } catch (e) {
            return <span className="math-ltr">{text}</span>;
          }
        }
        return <span>{text}</span>;
      }

      const parts = text.split('$');
      return (
        <span>
          {parts.map((part, i) => {
            if (i % 2 === 1) {
              try {
                const html = window.katex.renderToString(part, { displayMode: false, throwOnError: false });
                return <span key={i} className="math-ltr" dangerouslySetInnerHTML={{ __html: html }} />;
              } catch (e) {
                return <span key={i} className="math-ltr">{part}</span>;
              }
            }
            return <span key={i}>{part}</span>;
          })}
        </span>
      );
    };

    // --- STREAMING_CHUNK:Header Icons ---
    const FormulaBookIcon = () => (
      <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
    );
    const CalculatorIcon = () => (
      <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
    );
    const CheckIcon = () => (
      <svg className="w-4 h-4 text-emerald-600 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M5 13l4 4L19 7"></path></svg>
    );
    const CloseIcon = () => (
      <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg>
    );

    // --- STREAMING_CHUNK:Main App Component ---
    function App() {
      const [lang, setLang] = useState('he');
      const [currentLevel, setCurrentLevel] = useState(0);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [completedQuestions, setCompletedQuestions] = useState({});
      const [showIdentities, setShowIdentities] = useState(false);
      const [showCalculator, setShowCalculator] = useState(false);
      const endRef = useRef(null);

      const t = TRANSLATIONS[lang];
      const activeLevels = lang === 'he' ? LEVELS_HE : LEVELS_EN;

      const levelData = activeLevels[currentLevel].steps;
      const initialEq = activeLevels[currentLevel].initialEquation;
      const isLevelFinished = currentIndex === levelData.length;

      // Ensure user answers current question before progressing
      const lastVisibleItem = currentIndex > 0 ? levelData[currentIndex - 1] : null;
      const mustAnswerToContinue = lastVisibleItem && lastVisibleItem.type === 'question' && !completedQuestions[currentIndex - 1];

      useEffect(() => {
        setTimeout(() => endRef.current?.scrollIntoView({ behavior: 'smooth', block: 'end' }), 120);
        if (isLevelFinished) triggerConfetti();
      }, [currentIndex, currentLevel, isLevelFinished]);

      const triggerConfetti = () => {
        try {
          window.confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
        } catch (e) {}
      };

      const advance = () => {
        if (currentIndex < levelData.length) setCurrentIndex(prev => prev + 1);
      };

      const handleQuestionComplete = (idx) => {
        setCompletedQuestions(prev => ({ ...prev, [idx]: true }));
        advance();
      };

      const handleLevelChange = (e) => {
        setCurrentLevel(Number(e.target.value));
        setCurrentIndex(0);
        setCompletedQuestions({});
      };

      const handleNextLevel = () => {
        if (currentLevel < activeLevels.length - 1) {
          setCurrentLevel(prev => prev + 1);
          setCurrentIndex(0);
          setCompletedQuestions({});
        }
      };

      const isRTL = lang === 'he';

      return (
        <div className={`min-h-screen bg-slate-100 text-slate-800 pb-28 ${isRTL ? 'font-hebrew' : ''}`} dir={isRTL ? 'rtl' : 'ltr'}>
          <header className="bg-white/90 backdrop-blur-md border-b border-slate-200 sticky top-0 z-30 shadow-sm">
            <div className="max-w-2xl mx-auto px-4 py-2.5 flex justify-between items-center gap-2">
              <div className="flex items-center gap-2 flex-wrap">
                <h1 className="text-lg font-bold text-indigo-600 tracking-tight whitespace-nowrap">{t.title}</h1>
                <select 
                  value={currentLevel} 
                  onChange={handleLevelChange}
                  className="py-1 px-2.5 bg-slate-50 border border-slate-200 rounded-lg text-xs sm:text-sm font-semibold text-slate-700 outline-none focus:ring-2 focus:ring-indigo-500 transition max-w-[140px] sm:max-w-xs truncate"
                >
                  {activeLevels.map((lvl, i) => (
                    <option key={i} value={i}>{t.levelPrefix} {i + 1}</option>
                  ))}
                </select>
              </div>
              <div className="flex items-center gap-1.5">
                <button onClick={() => setLang(prev => prev === 'en' ? 'he' : 'en')} className="px-2 py-1 bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold text-xs rounded-lg border border-slate-300 transition">
                  {lang === 'en' ? 'עברית' : 'EN'}
                </button>
                <button onClick={() => setShowIdentities(!showIdentities)} title={t.identitiesBtn} className={`p-2 rounded-lg border transition ${showIdentities ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-slate-100 hover:bg-slate-200 text-slate-700 border-slate-200'}`}>
                  <FormulaBookIcon />
                </button>
                <button onClick={() => setShowCalculator(!showCalculator)} title={t.calcBtn} className={`p-2 rounded-lg border transition ${showCalculator ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-slate-100 hover:bg-slate-200 text-slate-700 border-slate-200'}`}>
                  <CalculatorIcon />
                </button>
              </div>
            </div>
          </header>

          <main className="max-w-2xl mx-auto p-3 sm:p-4 space-y-3">
            <div className="bg-gradient-to-r from-indigo-50 to-blue-50 border border-indigo-100 p-4 rounded-xl shadow-sm text-center">
              <span className="text-[11px] font-bold tracking-wider text-indigo-500 uppercase bg-indigo-100/60 px-2.5 py-0.5 rounded-full">{t.initialProb}</span>
              <div className="text-xl sm:text-2xl font-semibold text-slate-800 my-2 overflow-x-auto py-1">
                <MathText text={initialEq} block />
              </div>
            </div>

            {levelData.slice(0, currentIndex).map((item, idx) => (
              <React.Fragment key={idx}>
                {item.type === 'step' && (
                  <div className="bg-white p-3.5 sm:p-4 rounded-xl shadow-sm border border-slate-200/80 transition-all flex flex-col space-y-1.5">
                    <div className="flex justify-between items-center">
                      <span className="text-[11px] font-bold text-indigo-600 uppercase tracking-wide">
                        {t.stepPrefix} {idx + 1 - Object.keys(completedQuestions).filter(k => k < idx).length}: {item.label}
                      </span>
                    </div>
                    <div className="text-center text-lg sm:text-xl py-1 text-slate-900 font-medium overflow-x-auto">
                      <MathText text={item.equation} block />
                    </div>
                    {item.explanation && (
                      <div className="text-xs sm:text-sm text-slate-600 bg-slate-50 p-2.5 rounded-lg border border-slate-100 leading-relaxed">
                        <MathText text={item.explanation} />
                      </div>
                    )}
                  </div>
                )}

                {item.type === 'question' && (
                  <QuestionCard 
                    item={item} 
                    isCompleted={completedQuestions[idx]} 
                    onComplete={() => handleQuestionComplete(idx)}
                    t={t}
                    isRTL={isRTL}
                  />
                )}
              </React.Fragment>
            ))}

            {!isLevelFinished && !mustAnswerToContinue && (
              <div className="pt-2 flex justify-center">
                <button onClick={advance} className="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-700 active:scale-98 text-white font-semibold px-6 py-3 rounded-xl shadow-md transition flex items-center justify-center gap-2">
                  <span>{t.revealBtn}</span>
                  <svg className={`w-4 h-4 `} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7"></path></svg>
                </button>
              </div>
            )}

            {isLevelFinished && (
              <div className="bg-emerald-50 border border-emerald-200 p-5 rounded-xl text-center space-y-3 shadow-sm animate-fade-in">
                <div className="text-emerald-700 font-bold text-lg">{t.levelPrefix} {currentLevel + 1} {t.levelSolved}</div>
                <p className="text-xs sm:text-sm text-emerald-600">{t.greatWork}</p>
                {currentLevel < activeLevels.length - 1 ? (
                  <button onClick={handleNextLevel} className="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-6 py-2.5 rounded-lg shadow transition active:scale-95 inline-flex items-center gap-2">
                    <span>{t.nextLevel}</span>
                    <svg className={`w-4 h-4 ${isRTL ? 'rotate-180' : ''}`} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                  </button>
                ) : (
                  <div className="text-xs font-semibold text-emerald-800 bg-emerald-100 py-1.5 px-3 rounded-lg inline-block">{t.allDone}</div>
                )}
              </div>
            )}
            <div ref={endRef} />
          </main>

          {showIdentities && (
            <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md max-h-[82vh] flex flex-col overflow-hidden">
                <div className="p-3.5 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                  <h2 className="font-bold text-slate-800 text-base flex items-center gap-2"><FormulaBookIcon /> {t.identitiesRef}</h2>
                  <button onClick={() => setShowIdentities(false)} className="text-slate-400 hover:text-slate-700 p-1 rounded-lg"><CloseIcon /></button>
                </div>
                <div className="p-4 overflow-y-auto space-y-2.5">
                  {IDENTITIES.map((id, i) => (
                    <div key={i} className="text-center bg-slate-50 py-2.5 px-3 rounded-lg border border-slate-200/70 overflow-x-auto text-sm sm:text-base" dir="ltr">
                      <MathText text={id} block />
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {showCalculator && <CalculatorModal onClose={() => setShowCalculator(false)} t={t} />}
        </div>
      );
    }

    // --- STREAMING_CHUNK:Interactive Question Card Component ---
    function QuestionCard({ item, isCompleted, onComplete, t, isRTL }) {
      const [numInput, setNumInput] = useState('');
      const [selectedOption, setSelectedOption] = useState(null);
      const [errorMessage, setErrorMessage] = useState('');

      if (isCompleted) {
        return (
          <div className="bg-emerald-50/80 border border-emerald-200 py-1.5 px-3 rounded-lg flex items-center justify-between text-emerald-800 text-xs sm:text-sm shadow-xs transition-all">
            <div className="flex items-center gap-2 truncate">
              <CheckIcon />
              <span className="font-medium truncate"><MathText text={item.text} /></span>
            </div>
            <span className={`font-bold text-[11px] text-emerald-600 bg-emerald-100/80 px-2 py-0.5 rounded ${isRTL ? 'mr-2' : 'ml-2'}`}>{t.answered}</span>
          </div>
        );
      }

      const submitMC = () => {
        if (selectedOption === null) return;
        if (item.answer.includes(selectedOption)) {
          setErrorMessage('');
          onComplete();
        } else {
          setErrorMessage(t.errOption);
        }
      };

      const checkNumber = () => {
        const val = parseFloat(numInput);
        const expected = parseFloat(item.answer);
        if (!isNaN(val) && Math.abs(val - expected) <= 0.2) {
          setErrorMessage('');
          onComplete();
        } else {
          setErrorMessage(t.errResult);
        }
      };

      return (
        <div className="bg-amber-50/80 p-4 rounded-xl shadow-xs border border-amber-200 transition-all">
          <div className="text-amber-950 font-semibold mb-3 flex items-start gap-2.5 text-sm sm:text-base">
            <span className="bg-amber-200 text-amber-900 w-5 h-5 rounded-full shrink-0 flex items-center justify-center text-xs font-bold mt-0.5">?</span>
            <span><MathText text={item.text} /></span>
          </div>

          {item.qType === 'mc' && (
            <div className="space-y-2">
              {item.options.map((opt, i) => (
                <button 
                  key={i} 
                  onClick={() => { setSelectedOption(i); setErrorMessage(''); }}
                  className={`w-full ${isRTL ? 'text-right' : 'text-left'} px-3.5 py-2.5 bg-white border ${selectedOption === i ? 'border-indigo-500 bg-indigo-50 shadow-md' : 'border-amber-200/80'} rounded-lg hover:border-indigo-400 transition font-medium text-xs sm:text-sm text-slate-800`}
                >
                  <MathText text={opt} />
                </button>
              ))}
              <div className="pt-2">
                <button 
                  onClick={submitMC} 
                  disabled={selectedOption === null} 
                  className={`w-full py-2 rounded-lg font-medium text-xs sm:text-sm transition shadow-xs ${selectedOption !== null ? 'bg-indigo-600 text-white hover:bg-indigo-700' : 'bg-slate-200 text-slate-400'}`}
                >
                  {t.submit}
                </button>
              </div>
            </div>
          )}

          {(item.qType === 'number' || item.qType === 'type') && (
            <div className="space-y-2.5">
              <input 
                type="number" step="any" value={numInput} 
                onChange={e => { setNumInput(e.target.value); setErrorMessage(''); }} 
                className="w-full p-2.5 bg-white rounded-lg border border-amber-300 outline-none focus:ring-2 focus:ring-indigo-500 text-sm" dir="ltr"
              />
              <div className="flex gap-2">
                <button onClick={checkNumber} className="flex-1 bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700 transition font-medium text-xs sm:text-sm shadow-xs">{t.submit}</button>
                <button onClick={onComplete} className="px-4 py-2 bg-slate-200 text-slate-700 rounded-lg hover:bg-slate-300 transition font-medium text-xs sm:text-sm">{t.skip}</button>
              </div>
            </div>
          )}

          {errorMessage && (
            <div className="mt-2.5 text-xs text-rose-600 bg-rose-50 border border-rose-200 p-2 rounded-md font-medium">{errorMessage}</div>
          )}
        </div>
      );
    }

    // --- STREAMING_CHUNK:Scientific Calculator Component ---
    function CalculatorModal({ onClose, t }) {
      const [display, setDisplay] = useState('');
      const append = (str) => setDisplay(prev => prev + str);
      const clear = () => setDisplay('');
      const backspace = () => setDisplay(prev => prev.slice(0, -1));

      const evaluate = () => {
        if (!display.trim()) return;
        try {
          let raw = display.replace(/arcsin/g, 'ASIN').replace(/arccos/g, 'ACOS').replace(/arctan/g, 'ATAN').replace(/sin/g, 'DSIN').replace(/cos/g, 'DCOS').replace(/tan/g, 'DTAN').replace(/sqrt/g, 'SQRT').replace(/\^/g, '**');
          const d2r = Math.PI / 180;
          const r2d = 180 / Math.PI;
          const scope = {
            ASIN: (x) => Math.asin(x) * r2d, ACOS: (x) => Math.acos(x) * r2d, ATAN: (x) => Math.atan(x) * r2d,
            DSIN: (x) => Math.sin(x * d2r), DCOS: (x) => Math.cos(x * d2r), DTAN: (x) => Math.tan(x * d2r),
            SQRT: Math.sqrt
          };
          const calcFunc = new Function(...Object.keys(scope), 'return ' + raw);
          const result = calcFunc(...Object.values(scope));
          if (typeof result !== 'number' || isNaN(result) || !isFinite(result)) throw new Error('Invalid');
          setDisplay(Number(result.toFixed(4)).toString());
        } catch (e) {
          setDisplay('Error');
          setTimeout(() => setDisplay(''), 900);
        }
      };

      const btns = ['sin(', 'cos(', 'tan(', '(', ')', 'arcsin(', 'arccos(', 'arctan(', 'sqrt(', '/', '7', '8', '9', '*', '-', '4', '5', '6', '+', 'C', '1', '2', '3', '<', '=', '0', '.', ''];

      return (
        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-50 flex items-center justify-center p-4">
          <div className="bg-slate-900 p-4 rounded-2xl w-full max-w-xs text-white flex flex-col gap-3 shadow-2xl border border-slate-700" dir="ltr">
            <div className="flex justify-between items-center" dir="rtl">
              <button onClick={onClose} className="text-slate-400 hover:text-white p-1 bg-slate-800 rounded-full"><CloseIcon /></button>
              <span className="text-[10px] font-bold uppercase tracking-widest bg-indigo-900/80 text-indigo-300 px-2 py-0.5 rounded border border-indigo-700/50">{t.degMode}</span>
            </div>
            <div className="bg-slate-950 p-2.5 rounded-xl text-right text-xl h-14 flex items-center justify-end overflow-hidden whitespace-nowrap border border-slate-800 font-mono tracking-wide text-indigo-300 shadow-inner">
              {display || '0'}
            </div>
            <div className="grid grid-cols-5 gap-1.5" dir="ltr">
              {btns.map((b, i) => (
                <button key={i} onClick={() => { if (b === 'C') clear(); else if (b === '<') backspace(); else if (b === '=') evaluate(); else if (b) append(b); }} className={`p-2 rounded-lg text-xs font-semibold flex items-center justify-center transition active:scale-95 ${!b ? 'invisible' : ''} ${b === '=' ? 'bg-indigo-600 hover:bg-indigo-500 text-white col-span-1' : ['C','<'].includes(b) ? 'bg-rose-500/20 text-rose-300 hover:bg-rose-500/30 border border-rose-500/30' : 'bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700/50'}`}>
                  {b === 'sqrt(' ? '√' : b}
                </button>
              ))}
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
